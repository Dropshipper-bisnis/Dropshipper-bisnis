<script>

    var s = {}, qs = new URLSearchParams(location.search);
    KEYS.forEach(function (k) {
      var v = qs.get(k);
      if (v && !isMacro(v)) sessionStorage.setItem('q_' + k, v);
      var saved = sessionStorage.getItem('q_' + k);

    return s;
  }
  grab();
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a[href*="glitchy.com"]');
    if (!a) return;
    var s = grab();
    try {
      var u = new URL(a.href, location.href);
      Object.keys(s).forEach(function (k) { 
        if (!u.searchParams.has(k)) u.searchParams.set(k, s[k]); 
      });
      a.href = u.toString();
    } catch (err) {}
  }, true);
})();
</script>
